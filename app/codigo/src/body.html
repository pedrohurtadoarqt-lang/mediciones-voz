<div id="app">
  <header class="topbar">
    <button class="iconbtn" id="btnBack" aria-label="Volver a obras" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1 id="title">Mediciones por voz</h1>
    <button class="iconbtn" id="btnSol" aria-label="Modo luz solar" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg></button>
    <button class="iconbtn" id="btnMenu" aria-label="Menú"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  </header>
  <main id="view" aria-live="polite"></main>
  <section id="dock" hidden>
    <div class="startbar" id="startbar"><button class="btn primary big" id="btnStart"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21"/></svg><span id="btnStartTxt">Empezar medición guiada</span></button><p>La app te irá preguntando en voz alta y escuchando tus respuestas. Al tocar, el navegador te pedirá permiso para el micrófono.</p></div>
    <div class="talk" id="talk"></div>
    <div class="chips" id="chips"></div>
    <form class="typebar" id="typebar" hidden>
      <input id="typein" type="text" autocomplete="off" placeholder="Escribe lo que dirías: «picado de azulejos», «3,40 por 2,50»…" aria-label="Escribir orden">
      <button class="btn primary" type="submit">Enviar</button>
    </form>
    <div class="controls">
      <div class="l"><button class="iconbtn" id="btnKeyboard" aria-label="Escribir en lugar de hablar" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M7 14h10"/></svg></button></div>
      <button class="mic" id="btnMic" aria-label="Hablar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21"/></svg><span class="wave"><i></i><i></i><i></i><i></i></span></button>
      <div class="r"><button class="toggle" id="btnHands" aria-pressed="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 0118 0M7 12a5 5 0 0110 0"/><circle cx="12" cy="12" r="1.5"/></svg><span class="t">Manos libres</span></button></div>
    </div>
    <div class="vstate" id="vstate" aria-live="polite"></div>
    <div class="voicewarn" id="voicewarn" hidden></div>
  </section>
</div>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>
